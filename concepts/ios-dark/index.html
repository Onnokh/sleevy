<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sleevy iOS — before / after</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --backdrop: #050506;
    --screen: #0f0f11;
    --raised: #18181b;
    --pressed: #222226;
    --text: #f2f2f3;
    --muted: #8d8d93;
    --faint: #56565c;
    --blue: #6ea0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 1px 1px, #ffffff14 1px, transparent 0) 0 0 / 22px 22px,
      var(--backdrop);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 44px 40px 64px;
  }
  header.page { max-width: 1880px; margin: 0 auto 30px; display: flex; align-items: baseline; gap: 14px; }
  header.page h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  header.page p { color: var(--muted); font-size: 14px; }
  .pairs { display: grid; grid-template-columns: repeat(2, auto); gap: 56px 80px; justify-content: center; }
  .pair h2 { font-size: 17px; font-weight: 650; margin: 0 0 14px 4px; }
  .duo { display: flex; align-items: center; gap: 18px; }
  .duo .arrow { color: var(--faint); font-size: 22px; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  figcaption { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  figcaption.new { color: var(--blue); }

  /* Device: iPhone 17, 402 × 874 pt */
  .phone {
    width: 424px; height: 896px; border-radius: 58px; padding: 11px;
    background: linear-gradient(160deg, #2a2a2e, #141416 40%, #1d1d20);
    box-shadow: 0 0 0 1px #34343a, 0 40px 80px -20px #000;
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden;
    background: var(--screen); display: flex; flex-direction: column;
  }
  .screen.shot { background: #000; }
  .screen.shot img { width: 100%; height: 100%; display: block; }
  .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 5; }
  .status { height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 46px; font-size: 16px; font-weight: 600; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .scroll { flex: 1; overflow: hidden; position: relative; }

  /* Shared bits */
  svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .circle { width: 40px; height: 40px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; color: var(--text); box-shadow: inset 0 0 0 1px #ffffff0d; font-size: 13px; font-weight: 650; }
  .circle.avatar { background: #2c2c31; color: #cfcfd4; }
  .fav { position: relative; width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: #2b2b30; overflow: hidden; }
  .fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; }
  .count { color: var(--faint); font-size: 15px; font-variant-numeric: tabular-nums; }
  .section-label { color: var(--muted); font-size: 15px; font-weight: 500; padding: 18px 24px 8px; display: flex; align-items: center; gap: 6px; }
  .section-label .caret { font-size: 10px; color: var(--faint); }

  /* Top bars */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 4px 24px; }
  .topbar .actions { display: flex; gap: 8px; }
  .scope { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .scope .chev { color: var(--faint); width: 18px; height: 18px; margin-top: 3px; }
  .scope .pill { font-size: 14px; font-weight: 600; color: var(--muted); background: var(--raised); border-radius: 10px; padding: 2px 8px; letter-spacing: 0; }

  /* Saved Item rows */
  .rows { padding: 0 10px; }
  .row { display: flex; align-items: center; gap: 13px; padding: 11px 14px; border-radius: 14px; }
  .row .text { flex: 1; min-width: 0; }
  .row .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .domain { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; }
  .row .dot.read { background: transparent; }

  /* Floating tab bar */
  .tabbar { position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; gap: 10px; z-index: 4; }
  .tabs { flex: 1; display: flex; padding: 5px; border-radius: 32px; background: #1c1c1fe6; box-shadow: inset 0 0 0 1px #ffffff12, 0 10px 30px #000a; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 26px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .tab.on { background: #2c2c30; color: var(--text); }
  .tab svg.i { width: 22px; height: 22px; }
  .tab-search { width: 62px; height: 62px; border-radius: 50%; background: #1c1c1fe6; display: grid; place-items: center; color: var(--muted); box-shadow: inset 0 0 0 1px #ffffff12, 0 10px 30px #000a; }
  .tab-search.on { color: var(--text); background: #2c2c30; }
  .tab-search svg.i { width: 23px; height: 23px; }
  .fade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(transparent, var(--screen) 70%); z-index: 3; pointer-events: none; }

  /* Reader View */
  .reader-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 10px; }
  .seg { display: flex; padding: 3px; border-radius: 13px; background: var(--raised); box-shadow: inset 0 0 0 1px #ffffff0d; }
  .seg span { padding: 7px 14px; font-size: 14px; font-weight: 600; color: var(--muted); border-radius: 10px; }
  .seg span.on { background: #2e2e33; color: var(--text); }
  .article { padding: 14px 26px 0; }
  .article h3.title { font-size: 30px; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em; }
  .byline { display: flex; align-items: center; gap: 9px; margin-top: 14px; color: var(--muted); font-size: 15px; }
  .byline .fav { width: 20px; height: 20px; border-radius: 5px; font-size: 10px; }
  .summary { margin-top: 22px; padding: 15px 17px 17px; border-radius: 18px; background: var(--raised); box-shadow: inset 0 0 0 1px #ffffff0a; }
  .summary .label { color: var(--muted); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .summary .label .caret { font-size: 9px; color: var(--faint); }
  .summary p { font-size: 16px; line-height: 1.5; color: #d9d9dc; }
  .prose { margin-top: 26px; font-size: 17px; line-height: 1.6; color: #a3a3a9; }
  .prose h4 { color: var(--text); font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin-bottom: 8px; }
  .prose ul { margin: 12px 0 0 20px; }
  .prose li::marker { color: var(--faint); }
  .ask { position: absolute; left: 18px; right: 18px; bottom: 30px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 20px; border-radius: 28px; background: #1c1c1ff0; box-shadow: inset 0 0 0 1px #ffffff14, 0 12px 30px #000c; color: var(--faint); font-size: 16px; }
  .ask span { flex: 1; }
  .ask .send { width: 38px; height: 38px; border-radius: 50%; background: #3a3a40; color: var(--text); display: grid; place-items: center; }
  .outline-rail { position: absolute; right: 8px; top: 400px; display: flex; flex-direction: column; gap: 7px; z-index: 2; }
  .outline-rail i { display: block; height: 2px; border-radius: 1px; background: #ffffff26; }
  .outline-rail i.on { background: var(--text); }

  /* Library */
  .lib-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; padding: 6px 18px 8px 24px; display: flex; justify-content: space-between; align-items: center; }
  .nav { padding: 0 10px; }
  .nav .item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; font-size: 17px; font-weight: 500; }
  .nav .item .name { flex: 1; display: flex; align-items: center; gap: 7px; }
  .nav .item.add { color: var(--faint); }
  .globe { width: 13px !important; height: 13px !important; color: var(--faint); }
  .emoji { width: 22px; text-align: center; font-size: 17px; }

  /* Search */
  .field { margin: 6px 18px 4px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--raised); box-shadow: inset 0 0 0 1px #ffffff0d; font-size: 17px; }
  .field svg.i { color: var(--muted); }
  .field .caret-bar { width: 2px; height: 20px; background: var(--blue); margin-left: -8px; }
  .field .clear { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; background: #3a3a40; color: var(--screen); display: grid; place-items: center; }
  .field .clear svg.i { width: 11px; height: 11px; stroke-width: 3; color: #0f0f11; }
  .chips { display: flex; gap: 8px; padding: 12px 18px 2px; overflow: hidden; }
  .chips span { font-size: 14px; font-weight: 500; color: var(--muted); background: var(--raised); border-radius: 18px; padding: 7px 13px; white-space: nowrap; box-shadow: inset 0 0 0 1px #ffffff0a; }
  .chips span.on { color: var(--screen); background: var(--text); }
  mark { background: none; color: var(--blue); }
</style>
</head>

              <h4>Why it matters</h4>
              <p>The habit is easy to describe and hard to keep: save the thing you meant to read, then actually read it. Everything else in a reading list is in service of that one loop.</p>
              <ul>
                <li>Save it where you are, not where the article is.</li>
                <li>Let the list tell you what is still waiting.</li>
                <li>Read it without the page arguing for your attention.</li>
              </ul>
              <h4 style="margin-top:22px">In practice</h4>

<script>
  const status = document.getElementById("status");
  for (const screen of document.querySelectorAll("[data-status]")) {
    screen.prepend(status.content.cloneNode(true));
  }
  // Favicons come from the same icon service Demo Mode uses, over a monogram.
  function favicon(host) {
    const fav = document.createElement("span");
    fav.className = "fav";
    fav.textContent = host[0].toUpperCase();
    const img = new Image();
    img.src = `https://icons.duckduckgo.com/ip3/${host}.ico`;
    img.onerror = () => img.remove();
    fav.append(img);
    return fav;
  }
  for (const row of document.querySelectorAll(".row[data-host]")) {
    row.prepend(favicon(row.dataset.host));
  }
  for (const slot of document.querySelectorAll(".byline .fav[data-host]")) {
    slot.replaceWith(Object.assign(favicon(slot.dataset.host), { style: "width:20px;height:20px;border-radius:5px" }));
  }
</script>
</body>
</html>

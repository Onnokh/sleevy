<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sleevy for iPhone — native directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="symbols.css">
<link rel="stylesheet" href="symbols-extra.css">
<link rel="stylesheet" href="newyork.css">
<style>
  /* iOS dark system colours */
  :root {
    --bg: #000;
    --cell: #1c1c1e;
    --cell2: #2c2c2e;
    --label: #fff;
    --l2: rgba(235, 235, 245, 0.6);
    --l3: rgba(235, 235, 245, 0.3);
    --sep: rgba(84, 84, 88, 0.6);
    --fill: rgba(120, 120, 128, 0.32);
    --blue: #0a84ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 1px 1px, #ffffff12 1px, transparent 0) 0 0 / 22px 22px, #070708;
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 44px 48px 72px;
  }
  body.single { padding: 36px 48px 40px; }
  body.single .page-head { display: none; }
  .page-head { max-width: 1400px; margin: 0 auto 44px; }
  .page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .page-head p { color: var(--l2); font-size: 15px; margin-top: 6px; }
  section.variant { max-width: 1360px; margin: 0 auto 80px; }
  body.single section.variant { margin-bottom: 0; }
  .v-head { display: flex; gap: 12px; align-items: center; }
  .v-head .tag { font-size: 13px; font-weight: 800; color: #000; background: #fff; border-radius: 8px; padding: 3px 9px; }
  .v-head h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .v-idea { color: rgba(235, 235, 245, 0.75); font-size: 16px; margin-top: 8px; max-width: 1000px; line-height: 1.4; }
  .v-native { color: var(--l3); font-size: 13px; margin: 8px 0 26px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .row3 { display: flex; gap: 44px; }
  figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  figcaption { color: var(--l2); font-size: 13px; }

  /* Device: iPhone 17, 402 × 874 pt */
  .phone { width: 424px; height: 896px; border-radius: 58px; padding: 11px; background: linear-gradient(160deg, #2a2a2e, #141416 40%, #1d1d20); box-shadow: 0 0 0 1px #34343a, 0 40px 80px -20px #000; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: var(--bg); }
  .island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 9; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 8; display: flex; justify-content: space-between; align-items: center; padding: 4px 32px 0 50px; font-size: 17px; font-weight: 600; }
  .status .icons { display: flex; gap: 7px; align-items: center; }
  .status .sf { font-size: 12px; }
  .status .sf-battery-100percent { font-size: 13px; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 140px; height: 5px; border-radius: 3px; background: #fff; z-index: 9; }
  .edge-top { position: absolute; top: 0; left: 0; right: 0; height: 112px; background: linear-gradient(#000 50%, #0000); z-index: 4; }
  .edge-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 150px; background: linear-gradient(#0000, #000 72%); z-index: 4; }
  .scroll { position: absolute; inset: 0; padding-top: 104px; overflow: hidden; }

  /* Liquid Glass controls */
  .glass { background: rgba(46, 46, 50, 0.62); backdrop-filter: blur(20px) saturate(1.8); box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.3), inset 0 0 0 0.5px rgba(255, 255, 255, 0.12), 0 8px 24px rgba(0, 0, 0, 0.5); }
  .toolbar { position: absolute; top: 56px; left: 16px; right: 16px; height: 48px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  .toolbar .center { position: absolute; left: 50%; translate: -50% 0; }
  .gbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .gbtn .sf { font-size: 18px; }
  .gcap { height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 3px; }
  .gcap > span { min-width: 40px; height: 40px; display: grid; place-items: center; }
  .gcap .sf { font-size: 18px; }
  /* The ellipsis glyph box is only the dots, so it needs a smaller em. */
  .gbtn .sf-ellipsis, .gcap .sf-ellipsis { font-size: 6px; }
  .screen .gcap i.sf-chevron-up, .screen .gcap i.sf-chevron-down { font-size: 10px; }
  .screen .disc-h i.sf-chevron-down, .screen .igh i.sf-chevron-down { font-size: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(#8e8e93, #5a5a5f); font-size: 13px; font-weight: 600; }
  .gcap > span.av { min-width: 38px; }
  .inline-title { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .inline-title b { font-size: 17px; font-weight: 600; }
  .inline-title span { font-size: 12px; color: var(--l2); }

  /* Tab bar with a search-role tab */
  .tabbar { position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; gap: 12px; z-index: 5; }
  .tabs { flex: 1; height: 62px; border-radius: 31px; display: flex; padding: 4px; }
  .tab { flex: 1; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; }
  .tab .sf { font-size: 21px; }
  .tab.on { background: rgba(255, 255, 255, 0.12); }
  .tint-blue .tab.on { color: var(--blue); }
  .tabsearch { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; }
  .tabsearch .sf { font-size: 21px; }

  /* Bottom toolbar */
  .bottombar { position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 10px; align-items: center; z-index: 5; }
  .bottombar.split { justify-content: space-between; }
  .bottombar .gbtn { width: 50px; height: 50px; }
  .bottombar .gbtn .sf { font-size: 19px; }
  .bottombar .gcap { height: 50px; border-radius: 25px; }
  .bottombar .gcap > span { min-width: 46px; height: 46px; }
  .bottombar .gcap .sf { font-size: 19px; }
  .field { flex: 1; height: 50px; border-radius: 25px; display: flex; align-items: center; gap: 9px; padding: 0 6px 0 16px; color: var(--l2); font-size: 17px; }
  .field .sf { font-size: 17px; }
  .field .grow { flex: 1; }
  .field .mic { margin-right: 10px; }

  /* Favicons */
  .fav { position: relative; display: grid; place-items: center; flex: none; overflow: hidden; background: var(--cell2); color: #fff; font-weight: 700; }
  .fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fav.loaded { background: transparent; color: transparent; }

  /* Large title */
  .lt { padding: 0 20px 6px; }
  .lt h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
  .lt p { font-size: 15px; color: var(--l2); margin-top: 1px; }

  /* Plain list */
  .ph { font-size: 17px; font-weight: 600; padding: 18px 20px 4px; }
  .group > :last-child .cbody { border-bottom: 0; }

  /* Inset grouped list */
  .igh { font-size: 20px; font-weight: 700; padding: 22px 36px 8px; display: flex; justify-content: space-between; align-items: center; }
  .igh .sf { font-size: 14px; color: var(--blue); }
  .ig { margin: 0 16px; background: var(--cell); border-radius: 24px; overflow: hidden; }
  .igrow { display: flex; align-items: center; gap: 14px; padding-left: 16px; }
  .igrow > .sf { font-size: 21px; width: 28px; }
  .igbody { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 14px 16px 14px 0; border-bottom: 0.5px solid var(--sep); }
  .igrow:last-child .igbody { border-bottom: 0; }
  .igname { flex: 1; font-size: 17px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .igval { color: var(--l2); font-size: 17px; font-variant-numeric: tabular-nums; }
  .igrow .chev { font-size: 13px; color: var(--l3); }
  .pub { font-size: 13px; color: var(--l2); }
  .igrow.action { color: var(--blue); }
  .two { flex: 1; min-width: 0; }
  .two b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .two span { display: block; font-size: 15px; color: var(--l2); }
  .udot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); flex: none; }

  /* Reader */
  .art { padding: 8px 22px 0; }
  .art-title { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.005em; }
  .art-by { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--l2); font-size: 15px; }
  .disc { margin-top: 20px; background: var(--cell); border-radius: 22px; padding: 14px 16px 16px; }
  .disc-h { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; color: var(--l2); margin-bottom: 6px; }
  .disc-h .sf { font-size: 13px; color: var(--l2); }
  .disc p { font-size: 17px; line-height: 1.4; }
  .prose { margin-top: 24px; font-size: 17px; line-height: 1.5; color: rgba(235, 235, 245, 0.72); }
  .prose h4 { font-size: 20px; font-weight: 700; color: var(--label); margin-bottom: 8px; }
  .prose p + p, .prose ul { margin-top: 12px; }
  .prose ul { padding-left: 22px; }

  /* A — Plain: the reference's quiet list, sidebar and reader */
  section.variant.wide { max-width: 1840px; }
  .tgroup { display: flex; gap: 8px; }
  .qh { font-size: 15px; color: var(--l2); padding: 18px 20px 4px; }
  .qrow { display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 20px; }
  .qrow b { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qsec { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; color: var(--l2); padding: 22px 20px 4px; }
  .screen .qsec i.sf-chevron-down { font-size: 7px; }
  .qside { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px; font-size: 17px; }
  .qside .qi { width: 26px; display: grid; place-items: center; color: var(--l2); }
  .qside .qi .sf { font-size: 19px; }
  .qside .qi .sf-number { font-size: 17px; }
  .qside .nm { flex: 1; display: flex; align-items: center; gap: 7px; }
  .qside .nm .sf { font-size: 13px; color: var(--l3); }
  .qside .n { color: var(--l2); font-variant-numeric: tabular-nums; }
  .qside.add { color: var(--l2); }
  .qart { padding: 6px 22px 0; }
  .qart h2 { font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.015em; }
  .qby { display: flex; gap: 8px; align-items: center; margin-top: 14px; color: var(--l2); font-size: 16px; }
  .qsum { margin-top: 26px; background: var(--cell); border-radius: 22px; padding: 15px 18px 18px; }
  .qsum-h { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; color: var(--l2); margin-bottom: 8px; }
  .screen .qsum-h i.sf-chevron-down { font-size: 7px; }
  .qsum p { font-size: 18px; line-height: 1.45; }
  .qprose { margin-top: 30px; font-size: 18px; line-height: 1.6; color: rgba(235, 235, 245, 0.6); }
  .qprose p + p { margin-top: 16px; }
  .qblur { position: absolute; inset: 0; z-index: 6; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(9px); }
  .qpeek { position: absolute; left: 16px; right: 16px; top: 214px; z-index: 7; background: var(--cell); border-radius: 26px; padding: 18px 20px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .qpeek .qby { margin-top: 0; font-size: 15px; }
  .qpeek h3 { font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; margin-top: 12px; }
  .qpeek p { font-size: 17px; line-height: 1.4; color: rgba(235, 235, 245, 0.75); margin-top: 8px; }
  .qtags { display: flex; gap: 14px; margin-top: 14px; font-size: 15px; color: var(--l2); }
  .qmenu { position: absolute; left: 16px; width: 262px; top: 464px; z-index: 7; border-radius: 26px; padding: 6px 0; background: rgba(44, 44, 48, 0.9); backdrop-filter: blur(40px) saturate(1.8); box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.25), 0 20px 60px rgba(0, 0, 0, 0.7); }
  .qmi { display: flex; align-items: center; gap: 12px; padding: 11px 18px; font-size: 17px; }
  .qmi .qi { width: 24px; display: grid; place-items: center; }
  .qmi .qi .sf { font-size: 18px; }
  .qmi .lbl { flex: 1; }
  .qmi .lbl small { display: block; font-size: 13px; color: var(--l2); }
  .qmi > .sf { font-size: 12px; color: var(--l2); }
  .qmi.red { color: #ff453a; }
  .qsep { height: 8px; background: rgba(0, 0, 0, 0.25); margin: 6px 0; }

  /* Before / after */
  body.ba { padding: 40px 48px 44px; }
  body.ba .page-head { display: none; }
  .ba-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 30px; }
  .ba-head h1 { font-size: 24px; font-weight: 700; }
  .ba-head p { color: var(--l2); font-size: 14px; }
  .pairs { display: grid; grid-template-columns: repeat(2, auto); gap: 44px 80px; justify-content: start; }
  .pair > h3 { font-size: 17px; font-weight: 650; margin: 0 0 14px 4px; }
  .duo { display: flex; align-items: center; gap: 22px; }
  .duo .arrow { color: var(--l3); font-size: 22px; }
  .duo figcaption { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--l3); }
  .duo figcaption.new { color: var(--blue); }
  .screen.shot img { width: 100%; height: 100%; display: block; }

  /* B — Editorial */
  .ny { font-family: NY, serif; }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--l2); }
  .ed-head { padding: 0 20px 12px; }
  .ed-head h1 { font: 700 40px NY, serif; letter-spacing: -0.01em; margin-top: 2px; }
  .ed-head p { color: var(--l2); font-size: 15px; }
  .ed-lead { margin: 4px 20px 0; padding: 16px 0 18px; border-top: 1px solid var(--label); border-bottom: 0.5px solid var(--sep); }
  .ed-src { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--l2); }
  .ed-lead h3 { font: 700 30px/1.08 NY, serif; margin: 10px 0 8px; letter-spacing: -0.01em; }
  .ed-lead p { font-size: 16px; line-height: 1.4; color: rgba(235, 235, 245, 0.75); }
  .ed-row { margin: 0 20px; padding: 14px 0; border-bottom: 0.5px solid var(--sep); }
  .ed-row h4 { font: 600 20px/1.2 NY, serif; margin: 7px 0 4px; }
  .ed-row p { font-size: 15px; line-height: 1.35; color: var(--l2); }
  .ed-art { padding: 6px 24px 0; }
  .ed-art .kicker { display: flex; align-items: center; gap: 7px; }
  .ed-art h2 { font: 700 34px/1.08 NY, serif; margin-top: 12px; letter-spacing: -0.01em; }
  .ed-meta { color: var(--l2); font-size: 14px; margin-top: 10px; }
  .pull { margin-top: 20px; padding: 16px 0; border-top: 0.5px solid var(--sep); border-bottom: 0.5px solid var(--sep); font: italic 400 21px/1.35 NY, serif; }
  .pull .kicker { display: block; font-style: normal; margin-bottom: 8px; }
  .ed-prose { margin-top: 20px; font: 400 18px/1.55 NY, serif; color: rgba(235, 235, 245, 0.8); }
  .ed-prose h5 { font: 700 21px NY, serif; color: var(--label); margin-bottom: 8px; }
  .ed-prose p + p { margin-top: 12px; }
  .drop::first-letter { float: left; font: 700 56px/0.8 NY, serif; margin: 7px 8px 0 0; color: var(--label); }
  .toc { margin: 4px 20px 0; border-top: 1px solid var(--label); }
  .toc-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 0.5px solid var(--sep); }
  .toc-emoji { font-size: 22px; width: 28px; text-align: center; }
  .toc-main { flex: 1; }
  .toc-name { font: 600 24px NY, serif; }
  .toc-sub { font-size: 13px; color: var(--l2); margin-top: 2px; }
  .toc-count { font: 400 26px NY, serif; color: var(--l2); }
  .toc-add { color: var(--blue); font-size: 17px; padding: 14px 20px 4px; display: flex; gap: 8px; align-items: center; }
  .toc-add .sf { font-size: 16px; }

  /* C — Sidebar */
  .sb .igrow > .sf { color: var(--blue); }
  .cgroup .crow:last-child .cbody { border-bottom: 0; }
  .crow { display: flex; align-items: center; gap: 12px; padding-left: 12px; height: 52px; }
  .crow .udot { width: 9px; height: 9px; }
  .cbody { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 100%; border-bottom: 0.5px solid var(--sep); padding-right: 20px; }
  .ctitle { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctime { color: var(--l2); font-size: 14px; }
  .ph.small { font-size: 15px; color: var(--l2); padding: 14px 20px 2px; }

  /* D — Up Next */
  .next { margin: 6px 16px 0; background: var(--cell); border-radius: 28px; padding: 18px; }
  .nc-src { display: flex; gap: 12px; align-items: center; }
  .nc-src b { display: block; font-size: 15px; font-weight: 600; }
  .nc-src span { font-size: 13px; color: var(--l2); }
  .next h3 { font-size: 25px; line-height: 1.15; font-weight: 700; margin: 14px 0 8px; letter-spacing: -0.01em; }
  .next p { font-size: 17px; line-height: 1.4; color: rgba(235, 235, 245, 0.75); }
  .nc-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 16px; font-weight: 600; padding: 0 18px; }
  .btn .sf { font-size: 16px; }
  .btn.prominent { background: #fff; color: #000; flex: 1; }
  .btn.bordered { background: var(--fill); }
  .btn.icon { width: 48px; padding: 0; }
  .btn.wide { flex: 1; }
  .dots { display: flex; justify-content: center; gap: 7px; margin-top: 12px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--l3); }
  .dots i.on { background: var(--label); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 16px 0; }
  .tile { background: var(--cell); border-radius: 22px; padding: 12px 14px 12px 12px; height: 88px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
  .ic .sf { font-size: 16px; }
  .tile .n { font-size: 26px; font-weight: 700; }
  .tile .lbl { font-size: 16px; font-weight: 600; color: var(--l2); }
  .lic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; flex: none; }
  .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 6; }
  .sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 540px; border-radius: 42px; background: #1c1c1e; z-index: 7; padding-top: 8px; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6); }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--l3); margin: 0 auto 16px; }
  .sh-head { display: flex; gap: 12px; align-items: center; padding: 0 18px; }
  .sh-head .two b { font-size: 17px; }
  .sh-head .two span { font-size: 14px; }
  .sh-close { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--l2); flex: none; }
  .sh-close .sf { font-size: 12px; }
  .sh-sum { margin: 20px 18px 0; }
  .sh-label { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--l2); text-transform: uppercase; letter-spacing: 0.04em; }
  .sh-sum p { font-size: 17px; line-height: 1.4; margin-top: 6px; }
  .sh-btns { display: flex; gap: 10px; margin: 20px 18px 0; }
  .sheet .ig { margin: 18px 12px 0; background: var(--cell2); }

  /* Shared by E–I */
  .sumcard { margin-top: 20px; background: var(--cell); border-radius: 22px; padding: 14px 16px 16px; }
  .sum-h { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--l2); margin-bottom: 6px; }
  .sum-h .sf { font-size: 12px; }
  .sumcard p { font-size: 17px; line-height: 1.4; }
  .avatar.lg { width: 44px; height: 44px; font-size: 16px; flex: none; }
  .roundbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; flex: none; }
  .roundbtn .sf { font-size: 15px; }
  .meta { flex: 1; min-width: 0; }
  .meta small { display: block; font-size: 13px; color: var(--l2); }
  .meta b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* E — Sheet */

  /* ---- iPhone Duo ---------------------------------------------------------- */

  /* Cover display, 466 × 678 pt */
  .fold { width: 492px; height: 704px; border-radius: 58px; padding: 13px; background: linear-gradient(160deg, #2a2a2e, #141416 40%, #1d1d20); box-shadow: 0 0 0 1px #34343a, 0 40px 80px -20px #000; }

  .book { display: flex; perspective: 2600px; padding: 0 6px; }
  .half { height: 697px; padding: 14px 0; background: linear-gradient(160deg, #2a2a2e, #141416 40%, #1d1d20); box-shadow: 0 0 0 1px #34343a, 0 40px 80px -20px #000; }
  .half.l { padding-left: 14px; border-radius: 58px 0 0 58px; transform-origin: right center; transform: rotateY(7deg); }
  .half.r { padding-right: 14px; border-radius: 0 58px 58px 0; transform-origin: left center; transform: rotateY(-7deg); }
  .half > .dscreen { width: 475.5px; height: 669px; }
  .half.l > .dscreen { border-radius: 44px 0 0 44px; }
  .half.r > .dscreen { border-radius: 0 44px 44px 0; }
  /* The crease: a soft shadow on each side of the hinge. */
  .half.l > .dscreen::after, .half.r > .dscreen::after { content: ""; position: absolute; top: 0; bottom: 0; width: 34px; z-index: 20; pointer-events: none; }
  .half.l > .dscreen::after { right: 0; background: linear-gradient(to left, rgba(0, 0, 0, 0.55), transparent); box-shadow: inset -1px 0 rgba(255, 255, 255, 0.07); }
  .half.r > .dscreen::after { left: 0; background: linear-gradient(to right, rgba(0, 0, 0, 0.55), transparent); box-shadow: inset 1px 0 rgba(255, 255, 255, 0.07); }

const wheel = (n, at) => {
  const radius = 132 / 2 - 8;
  return `<span class="wheel glass">${Array.from({ length: n }, (_, i) => {
    const angle = ((i - at) * 22) / radius;
    if (Math.abs(angle) >= Math.PI / 2) return "";
    const on = i === at;
    return `<i class="${on ? "on" : ""}" style="translate:0 ${(radius * Math.sin(angle)).toFixed(1)}px;opacity:${on ? 1 : (0.5 * Math.cos(angle)).toFixed(2)}"></i>`;
  }).join("")}</span>`;
};

};

  ["What fast costs", "1 min", ["Speed has a price. It asks for less on the screen, fewer features, and the patience to remove what does not earn its place.", "It is a price worth paying. People forgive a tool for what it cannot do. They do not forgive it for making them wait."]],
];
const paras = (ps) => ps.map((t) => `<p>${t}</p>`).join("");
const section = ([h, , ps]) => `<h3>${h}</h3>${paras(ps)}`;
const byline = (i, size = 22) => `<div class="dby">${fav(i.host, size, 5)}${i.host} · ${i.age}</div>`;
const article = (i, sections) => `${byline(i)}<h2 class="dtitle">${i.title}</h2>
  <div class="qsum"><div class="qsum-h">Summary${sf("chevron-down")}</div><p>${i.summary}</p></div>
  <div class="qprose">${sections}</div>`;
const readerRail = (foot = "") => rail(`${rbtn("chevron-left")}${rcap("chevron-up", "chevron-down")}${rbtn("ellipsis")}`, foot);
const next = items[1];

// 1 — Contents: the Inbox on the left page, the save on the right page.
const duo1 = [
  fold(`<div class="dpage rl">${article(lead, paras(fast[0][2]) + paras(fast[1][2]))}</div><div class="dfade"></div>${readerRail(wheel(5, 0))}`,
    "Cover — the Reader View; the toolbar is in the rail"),
  book(`<div class="dpage flush"><div class="lt"><h1>Inbox</h1><p>19 unread</p></div><div class="qh">Today</div>${today.map((i, n) => qrow(i).replace('class="qrow"', `class="qrow${n === 0 ? " sel" : ""}"`)).join("")}<div class="qh">Yesterday</div>${yesterday.map(qrow).join("")}</div><div class="dfade" style="height:70px"></div>`,
    `<div class="dpage rl">${article(lead, paras(fast[0][2]) + paras(fast[1][2]))}</div><div class="dfade"></div>${rail(`${rcap("chevron-up", "chevron-down")}${rcap("checkmark-circle", "folder", "ellipsis")}`, wheel(5, 0))}`,
    "Open — the Inbox on the left page, the save on the right page"),
];

// 2 — Pages: the save is set as a book, two pages at a time.
const flow = `<p class="first">${fast[0][2][1]}</p>${section([fast[1][0], , fast[1][2].slice(0, 2)])}${fast.slice(2, 4).map(section).join("")}`;
const duo2 = [
  fold(`<div class="dpage rl bk-open" style="padding-top:40px">${byline(lead)}<h2 class="dtitle">${lead.title}</h2>
      <div class="qsum"><div class="qsum-h">Summary${sf("chevron-down")}</div><p>${lead.summary}</p></div>
      <div class="bk-text"><p class="first">${fast[0][2][0]}</p><p>Look at the tools you go back to every day. Most of them are not the strongest of their kind. They are the ones that never make you wait.</p></div><div class="bk-folio" style="right:14px">1</div></div>
    ${rail(`${rbtn("chevron-left")}${rbtn("textformat-size")}${rbtn("ellipsis")}`, wheel(5, 0))}`,
    "Cover — one page at a time; the first page opens the save"),
  book(`<div class="bk" style="left:72px"><div class="bk-head">Fast Software, the Best Software</div><div class="bk-text">${flow}</div><div class="bk-folio">4</div></div>`,
    `<div class="bk" style="left:34px"><div class="bk-head">craigmod.com</div><div class="bk-text"><div style="margin-top:-513px">${flow}</div></div><div class="bk-folio">5</div></div>
    ${rail(`${rbtn("chevron-left")}${rbtn("textformat-size")}${rbtn("ellipsis")}`, wheel(5, 2))}`,
    "Open — two pages of the save, with running heads and page numbers"),
];

// 3 — Outline: the front matter and the Article Outline face the text.
const olRows = (at) => fast.map(([h, m], n) => `<div class="ol-row${n === at ? " on" : n < at ? " done" : ""}"><span class="no">${n + 1}</span><span class="t">${h}</span><span class="m">${m}</span></div>`).join("");
const duo3 = [
  fold(`<div class="dpage rl"><div class="qprose" style="margin-top:0">${section(fast[1])}${section(fast[2])}</div></div>${deck(2)}
    ${rail(`${rbtn("chevron-left")}${rbtn("ellipsis")}`, wheel(5, 2))}`,
    "Cover — turn the wheel; the deck shows the section under your finger"),
  book(`<div class="dpage" style="padding:30px 40px 0 34px">${byline(lead, 24)}<h2 class="dtitle" style="font-size:32px">${lead.title}</h2>
      <div class="dmeta"><span>${sf("folder")}Longreads</span><span>${sf("number")}Tools</span><span>${sf("number")}Design</span></div>
      <div class="qsum"><div class="qsum-h">Summary${sf("chevron-down")}</div><p>${lead.summary}</p></div>
      <div class="olh">Outline<span>6 min</span></div>${olRows(1)}</div>`,
    `<div class="dpage rl" style="padding-left:34px"><div class="sec-of">2 of 5</div><div class="qprose" style="margin-top:0">${section(fast[1])}${section(fast[2])}</div></div><div class="dfade"></div>
    ${rail(`${rbtn("chevron-left")}${rcap("chevron-up", "chevron-down")}${rcap("checkmark-circle", "folder", "ellipsis")}`, wheel(5, 1))}`,
    "Open — the Article Outline on the left page, the text on the right page"),
];

// 4 — Chapters: the Inbox is the book, and each save is a chapter.
const endOf = `<div class="qprose" style="margin-top:0">${section(fast[4])}</div><div class="endmark">• • •</div>`;
const duo4 = [
  fold(`<div class="dpage rl" style="padding-top:44px">${endOf}<div class="dbtn pri">${sf("checkmark-circle")}Mark Read</div><div class="dcard">${qmi("folder", "Move to Folder", { sub: "Longreads", more: true })}${qmi("square-and-arrow-up", "Share")}</div></div>
    <div class="peek"><div class="nextlbl">Next in Inbox<span>2 of 19</span></div>${byline(next, 18)}<b>${next.title}</b></div>
    ${rail(`${rbtn("chevron-left")}${rbtn("ellipsis")}`)}`,
    "Cover — the end of a save, with the next save below it"),
  book(`<div class="dpage" style="padding:44px 40px 0 34px">${endOf}<div class="dbtn pri">${sf("checkmark-circle")}Mark Read</div>
      <div class="dcard">${qmi("folder", "Move to Folder", { sub: "Longreads", more: true })}${qmi("square-and-arrow-up", "Share")}${qmi("trash", "Delete", { cls: "red" })}</div></div>`,
    `<div class="dpage rl" style="padding:44px 14px 0 34px"><div class="nextlbl">Next in Inbox<span>2 of 19</span></div>
      <div style="margin-top:22px">${byline(next, 24)}</div><h2 class="dtitle" style="font-size:34px">${next.title}</h2>
      <div class="qsum"><div class="qsum-h">Summary${sf("chevron-down")}</div><p>${next.summary}</p></div>
      <div class="qprose fadeout"><p>Great work rarely starts with a plan. It starts with a question you cannot stop asking, and with the patience to follow it further than seems sensible.</p></div></div>
    <div class="turn"><span>Turn the page to start</span>${sf("chevron-right")}</div>
    ${rail(`${rbtn("chevron-left")}${rcap("chevron-up", "chevron-down")}${rbtn("ellipsis")}`)}`,
    "Open — the end of one save faces the start of the next"),
];


// 5 — Pages + Outline: one Reader View; the Outline switch in the rail changes the left page.
const tocPages = [1, 4, 4, 5, 7];
const tocRows = (at) => fast.map(([h], n) => `<div class="ol-row${n === at ? " on" : n < at ? " done" : ""}"><span class="no">${n + 1}</span><span class="t">${h}</span><span class="m">${tocPages[n]}</span></div>`).join("");
const pagesRail = (on, foot) => rail(`${rbtn("chevron-left")}${rbtn("list-bullet-indent").replace("rbtn glass", `rbtn glass${on ? " on" : ""}`)}${rbtn("textformat-size")}${rbtn("ellipsis")}`, foot);
const page5 = `<div class="bk" style="left:34px"><div class="bk-head">craigmod.com</div><div class="bk-text"><div style="margin-top:-513px">${flow}</div></div><div class="bk-folio">5</div></div>`;
const coverPage5 = `<p class="first">they get out of the way.</p>${paras(fast[2][2].slice(1))}${section(fast[3])}`;
const duo5 = [
  { on: false, label: "Outline off", note: "two pages of text, and the wheel in the rail", screens: [
    fold(`<div class="bk" style="left:30px;width:328px"><div class="bk-head">Fast Software, the Best Software</div><div class="bk-text">${coverPage5}</div><div class="bk-folio">5</div></div>${pagesRail(false, wheel(5, 2))}`,
      "Cover — one page at a time; the wheel at rest"),
    book(`<div class="bk" style="left:72px"><div class="bk-head">Fast Software, the Best Software</div><div class="bk-text">${flow}</div><div class="bk-folio">4</div></div>`,
      `${page5}${deck(3, tocPages)}${pagesRail(false, wheel(5, 3))}`,
      "Open — turn the wheel: the deck shows each section and its page, and the pages turn to it"),
  ] },
  { on: true, label: "Outline on", note: "the Outline takes the left page, and the wheel moves its mark", screens: [
    fold(`<div class="dpage rl">${byline(lead)}<h2 class="dtitle">${lead.title}</h2>
        <div class="qsum"><div class="qsum-h">Summary${sf("chevron-down")}</div><p>${lead.summary}</p></div>
        <div class="olh">Outline<span>8 pages</span></div>${tocRows(2)}</div>${pagesRail(true, wheel(5, 2))}`,
      "Cover — the Outline replaces the page; tap a section, or turn the wheel"),
    book(`<div class="dpage" style="padding:30px 40px 0 34px">${byline(lead, 24)}<h2 class="dtitle" style="font-size:32px">${lead.title}</h2>
        <div class="dmeta"><span>${sf("folder")}Longreads</span><span>${sf("number")}Tools</span><span>${sf("number")}Design</span></div>
        <div class="qsum"><div class="qsum-h">Summary${sf("chevron-down")}</div><p>${lead.summary}</p></div>
        <div class="olh">Outline<span>8 pages</span></div>${tocRows(2)}</div>`,
      `${page5}${pagesRail(true, wheel(5, 2))}`,
      "Open — the whole Outline is on the left page, so the wheel needs no deck"),
  ] },
];

const duoIdeas = [
  { id: "1", name: "Contents", screens: duo1,
    idea: "The middle and right columns of the reference, one on each page. The left page is the Inbox, one line per save, and the open save is marked. The right page is the Reader View. Tap a line to change the save; the list stays where it is. When you close the device, the cover shows only the Reader View.",
    native: "onHingeChange (.partiallyOpen → two pages) · HStack(spacing: 0) split on the window center · List(selection:) · OutlineScrubber in the rail" },
  { id: "2", name: "Pages", screens: duo2,
    idea: "The save is set as a book. The text flows from the left page to the right page, with a running head at the top and a page number at the bottom. Swipe sideways to turn two pages. On the cover, the first page holds the title and the Summary card, like the first page of a chapter.",
    native: "TextKit 2: one NSTextContainer per page · ScrollView(.horizontal) + .scrollTargetBehavior(.paging) · .accessibilityRotor(.headings)" },
  { id: "3", name: "Outline", screens: duo3,
    idea: "The left page is the front matter of the save: the title, the Folder, the Tags, the Summary card and the Article Outline. The section you read is marked, and the sections you finished are gray. Tap a section to show it on the right page, or turn the scroll wheel in the rail: the mark moves down the list. On the cover, the wheel works as it does today, with the deck of sections beside it.",
    native: "ScrollViewReader.scrollTo(_:anchor: .top) · .onScrollTargetVisibilityChange · OutlineScrubber + OutlineDeck in the rail" },
  { id: "4", name: "Chapters", screens: duo4,
    idea: "The Inbox is the book, and each save is a chapter. At the end of a save, the left page holds the end and the actions: Mark Read, Move to Folder, Share and Delete. The right page starts the next save with its title and Summary card. Turn the page to read it.",
    native: "ScrollView(.horizontal) paging over the Inbox · Button(.borderedProminent) · .safeAreaInset(edge: .bottom) for the next save on the cover" },
  { id: "5", name: "Pages + Outline", rows: duo5,
    idea: "One Reader View with an Outline switch in the rail. When the switch is off, the save is set as a book: the text runs across the two pages, and you swipe to turn two pages. When the switch is on, the Outline takes the left page: the title, the Folder, the Tags, the Summary card and the sections with their page numbers, like the contents page of a book. The section you read is marked. Tap a section to go to its page. Only the right page turns while the Outline is open. The scroll wheel stays at the bottom of the rail, with its tick at each section. When the Outline is off, the deck shows the section and its page beside the wheel. When the Outline is on, the wheel moves the mark in the list. On the cover, the same switch shows the Outline in place of the page.",
    native: "Toggle(isOn:) { Label(\"Outline\", systemImage: \"list.bullet.indent\") }.toggleStyle(.button) · OutlineScrubber + OutlineDeck · TextKit 2: one NSTextContainer per page" },
];

if (new URLSearchParams(location.search).has("duo")) {
  document.body.classList.add("duo-page");
  document.querySelector(".page-head").innerHTML = `<h1>Sleevy for iPhone Duo — Reader View, direction A</h1><p>Each idea on the cover display (closed) and on the inner display (open like a book). The hinge is at the center. The system rail is on the right.</p>`;
  const one = new URLSearchParams(location.search).get("dv");
  if (one) document.body.classList.add("single");
  document.getElementById("variants").innerHTML = duoIdeas.filter((d) => !one || d.id === one).map((d) => `
    <section class="dsec">
      <div class="v-head"><span class="tag">${d.id}</span><h2>${d.name}</h2></div>
      <p class="v-idea">${d.idea}</p>
      <p class="v-native">${d.native}</p>
      ${d.rows ? d.rows.map((r) => `<div class="drow"><div class="drow-h"><span class="chip ${r.on ? "on" : "glass"}">${sf("list-bullet-indent")}</span>${r.label}<span>— ${r.note}</span></div><div class="dpair">${r.screens.join("")}</div></div>`).join("") : `<div class="dpair">${d.screens.join("")}</div>`}
    </section>`).join("");
}

// Favicons come from the same icon service Demo Mode uses, over a monogram.
for (const el of document.querySelectorAll(".fav[data-host]")) {
  const img = new Image();
  img.onload = () => el.classList.add("loaded");
  img.onerror = () => img.remove();
  img.src = `https://icons.duckduckgo.com/ip3/${el.dataset.host}.ico`;
  el.append(img);
}
</script>
</body>
</html>
